<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ebola anthropologist</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <h1>Ebola anthropologist — <span id="run">…</span></h1>
    <div class="spacer"></div>
    <button id="reset" title="Clear the conversation and the sandbox session">Reset chat</button>
    <button id="regen">Regenerate report</button>
  </header>

  <main>
    <section id="left">
      <div id="tiles" class="tiles"></div>
      <div id="plots" class="plots"></div>
      <p id="no-report" class="muted" hidden>
        No report yet — click “Regenerate report” to compute metrics and plots.
      </p>
    </section>

    <section id="chat">
      <div id="transcript"></div>
      <form id="ask">
        <label class="autorun" title="Run model-written code without asking. The sandbox still applies, but approval is the real guardrail — leave off for untrusted runs.">
          <input type="checkbox" id="autorun" /> auto-run code
        </label>
        <div class="inputrow">
          <div id="mentions" hidden></div>
          <input id="question" type="text" autocomplete="off"
                 placeholder="Ask about the run (@ to mention a file) — who was patient zero?" />
          <button type="submit" id="send">Send</button>
          <button type="button" id="stop" hidden>Stop</button>
        </div>
      </form>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
