[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pandemics"
version = "0.1.0"
description = "Contact-sickness scenarios for TerraLingua, with a run viewer and an epidemic anthropologist."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "terralingua @ git+https://github.com/cognizant-ai-lab/terralingua.git@main",
    "terralingua-launcher @ git+https://github.com/GPaolo/terralingua_launcher.git@main",
    "faker",
    "pydantic",
    "fastapi",
    "uvicorn",
    "matplotlib",
    "numpy",
    "pandas",
    "anthropic",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pandemics*"]

[tool.setuptools.package-data]
pandemics = ["viewer/static/*", "anthropologist/static/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["F401", "E501"]
