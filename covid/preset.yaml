name: covid
description: Covid-calibrated airborne sickness with presymptomatic spread on a torus
  grid, with roles, masks, a hospital, and no burials.
config:
  run:
    scenario: pandemics
    scenario_options:
      init_infected: 2
      outbreak_step: 0
      incubation_min: 2
      incubation_max: 7
      infection_duration: 10
      mobile_days: 7
      feverish_multiplier: 1.0
      infection_radius: 1
      infection_probability: 0.2
      contact_multiplier: 1.2
      airborne: true
      airborne_multiplier: 0.5
      airborne_decay: 0.5
      airborne_radius: 2
      airborne_presymptomatic_days: 2
      energy_multiplier: 2
      case_fatality: 0.02
      ppe_protection: 0.3
      ppe_role: health_worker
      ppe_per_worker: 20
      burials: false
      funeral_announcements: true
      funeral_announcement_radius: -1
      remains_lifespan: 1
      health_centers_path: covid/health_centers.json
    exp_name: covid
    exp_description: Covid-calibrated airborne sickness with presymptomatic spread
    max_ts: 200
    seed: 1
    max_parallel_workers: 20
    save_video: false
    live_render: false
    env_heartbeat: -1
  agent:
    genome: ocean_5
    agents_name_prefix: being
    max_history: 3
    internal_memory_size: 300
    use_inventory: true
    use_colors: false
    scenario_specific_instructions: instructions.md
    personas_path: personas.json
    random_names: true
  env:
    world_type: grid
    grid_size: 30
    dynamic_grid_scaling: false
    vision_radius: 6
    init_agents: 20
    min_agents: 0
    init_agent_energy: 200
    agent_lifespan: 250
    food_mechanism: true
    init_food: 500
    food_zones: 4
    food_spawn_rate: 50
    drop_food_on_death: false
    reproduction_cost: -1
    artifact_creation_cost: 0
    max_artifact_tokens: 200
    max_message_length: 50
